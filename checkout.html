<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>مصيفي | تأكيد الحجز والدفع</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    .checkout-page-container { padding-top: 30px; padding-bottom: 60px; }
    .checkout-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
    @media (max-width: 768px) { .checkout-grid { grid-template-columns: 1fr; } }
    .summary-card, .form-card { background: #121c18; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 20px; }
    .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: rgba(255,255,255,0.85); }
    .form-group input { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; box-sizing: border-box; }
    .submit-btn { width: 100%; padding: 15px; background: #20b2aa; color: #0d1512; border: none; border-radius: 10px; font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 10px; }
    .booking-code-badge { background: rgba(32, 178, 170, 0.15); color: #20b2aa; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-family: monospace; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="brand">مصيفي<span class="dot">.</span></a>
    </div>
  </nav>

  <main class="checkout-page-container container">
    <div style="margin-bottom:20px;">
      <h1 style="font-size:24px; color:#fff;">إتمام تأكيد الحجز 💳</h1>
    </div>

    <div class="checkout-grid">
      <div class="summary-card">
        <h3 style="color:#20b2aa; margin-top:0;">ملخص تفاصيل الحجز</h3>
        <div class="summary-row"><span>كود الحجز:</span> <strong id="generated-booking-code" class="booking-code-badge">جاري التوليد...</strong></div>
        <div class="summary-row"><span>اسم الشاليه:</span> <strong id="sum-title">-</strong></div>
        <div class="summary-row"><span>تاريخ الوصول:</span> <strong id="sum-checkin">-</strong></div>
        <div class="summary-row"><span>تاريخ المغادرة:</span> <strong id="sum-checkout">-</strong></div>
        <div class="summary-row"><span>عدد الأفراد:</span> <strong id="sum-guests">1</strong></div>
        <div class="summary-row"><span>المبلغ المطلوب:</span> <strong id="sum-payable" style="color:#d9a441; font-size:18px;">0 ج.م</strong></div>
      </div>

      <div class="form-card">
        <form id="checkout-form">
          <div class="form-group">
            <label>الاسم بالكامل *</label>
            <input type="text" id="client-name" required placeholder="أدخل اسمك الثلاثي">
          </div>

          <div class="form-group">
            <label>رقم الهاتف (واتساب) *</label>
            <input type="tel" id="client-phone" required placeholder="01xxxxxxxxx">
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">تأكيد الحجز والإرسال ←</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const chaletId = urlParams.get('id');
      const checkin = urlParams.get('checkin') || urlParams.get('checkIn') || '-';
      const checkout = urlParams.get('checkout') || urlParams.get('checkOut') || '-';
      const guests = urlParams.get('guests') || '1';
      const total = urlParams.get('total') || '0';
      const payable = urlParams.get('payable') || total;
      const payType = urlParams.get('payment_type') === 'deposit' ? 'عربون' : 'كامل';

      // توليد كود حجز فريد
      const randomCode = 'MSF-' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('generated-booking-code').innerText = randomCode;

      const allChalets = JSON.parse(localStorage.getItem('mosaify_chalets')) || [];
      const currentChalet = allChalets.find(c => String(c.id) === String(chaletId)) || { title: 'شاليه مصيفي' };

      document.getElementById('sum-title').innerText = currentChalet.title;
      document.getElementById('sum-checkin').innerText = checkin;
      document.getElementById('sum-checkout').innerText = checkout;
      document.getElementById('sum-guests').innerText = guests;
      document.getElementById('sum-payable').innerText = `${Number(payable).toLocaleString()} ج.م`;

      const form = document.getElementById('checkout-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const btn = document.getElementById('submit-btn');
        btn.innerText = 'جاري التأكيد... ⏳';
        btn.disabled = true;

        const bookingData = {
          id: randomCode,
          code: randomCode,
          bookingCode: randomCode,
          chaletId: chaletId || currentChalet.id || '1',
          chaletTitle: currentChalet.title || 'شاليه مصيفي',
          customerName: document.getElementById('client-name').value,
          name: document.getElementById('client-name').value,
          customerPhone: document.getElementById('client-phone').value,
          phone: document.getElementById('client-phone').value,
          checkin: checkin,
          checkIn: checkin,
          checkout: checkout,
          checkOut: checkout,
          guests: guests,
          totalPrice: total,
          total: total,
          payableAmount: payable,
          payable: payable,
          paymentType: payType,
          status: 'مقبول', // أو active حسب لوحة الأدمن
          createdAt: new Date().toLocaleDateString('ar-EG')
        };

        // حفظ الحجز في localStorage
        let bookings = [];
        try {
          bookings = JSON.parse(localStorage.getItem('mosaify_bookings')) || [];
        } catch(err) {
          bookings = [];
        }

        bookings.push(bookingData);
        localStorage.setItem('mosaify_bookings', JSON.stringify(bookings));

        alert(`تم الحجز بنجاح!\nكود الحجز الخاص بك هو: ${randomCode}`);
        window.location.href = 'admin.html'; // أو الصفحة الرئيسية حسب المطلوب
      });
    });
  </script>
</body>
</html>
